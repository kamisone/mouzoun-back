{%- if policy.lines %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="{{ dir }}" style="border-collapse:collapse;margin:0 0 20px 0;font-size:13px;background-color:#fbf7f0;">
  <tr><td style="padding:12px 16px 4px 16px;font-weight:bold;text-align:{{ start }};">{{ labels.cancellation_policy }}</td></tr>
  {%- for line in policy.lines %}
  <tr><td style="padding:2px 16px;color:#4a4035;text-align:{{ start }};">• {{ line }}</td></tr>
  {%- endfor %}
  <tr><td style="padding:0 0 10px 0;"></td></tr>
</table>
{%- endif %}
