# Local development: databases and a fake mail server. Run the API with `cargo run` (see README).
# Fixed project name: avoids clashing with other projects whose folder is also called "back".
name: mouzoun

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mouzoun
      POSTGRES_PASSWORD: mouzoun
      POSTGRES_DB: mouzoun
    ports: ["${POSTGRES_PORT:-5433}:5432"]  # 5433 on host: 5432 is often taken by other projects
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mouzoun"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "mouzoun-redis", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6380}:6379"]
    volumes: [redisdata:/data]

  # Catches every email sent with EMAIL_PROVIDER=smtp SMTP_HOST=localhost SMTP_TLS=none:
  # web UI on http://localhost:8025 (nothing ever leaves your machine).
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ["${MAILPIT_SMTP_PORT:-1025}:1025", "${MAILPIT_UI_PORT:-8025}:8025"]

volumes:
  pgdata:
  redisdata:
