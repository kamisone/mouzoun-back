# Local development: databases only. Run the API with `cargo run` (see README).
# Fixed project name: avoids clashing with other projects whose folder is also called "back".
name: mouzoun

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mouzoun
      POSTGRES_PASSWORD: mouzoun
      POSTGRES_DB: mouzoun
    ports: ["${POSTGRES_PORT:-5433}:5432"]  # 5433 on host: 5432 is often taken by other projects
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mouzoun"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "mouzoun-redis", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6380}:6379"]
    volumes: [redisdata:/data]

volumes:
  pgdata:
  redisdata:
