[package]
name = "mouzoun-api"
version = "0.1.0"
edition = "2024"
publish = false
# `cargo run` starts the API; other tools: --bin worker | email | seed_dev
default-run = "mouzoun-api"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22"
bytes = "1.12.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
google-cloud-auth = "1.18.0"
google-cloud-gax = "1.15.0"
google-cloud-storage = "1.21.0"
google-cloud-wkt = "1.10.0"
hmac = "0.12"
ipnetwork = { version = "0.20", features = ["serde"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1", "tokio1-rustls-tls"] }
minijinja = { version = "2", features = ["loader"] }
rand = "0.9"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
# Payment providers and Turnstile (already in the tree through the Google SDK).
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "ipnetwork", "rust_decimal", "migrate", "macros"] }
thiserror = "2"
time = "0.3.55"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.20"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "timeout", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
validator = { version = "0.20", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
# Test helpers (in-memory object storage): enabled only by the test-suite, never in production.
test-utils = []

[dev-dependencies]
# Integration tests (tests/) build this crate with its test helpers.
mouzoun-api = { path = ".", features = ["test-utils"] }
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util"] }
