# Installed to /etc/nginx/mouzoun/routes.conf. Shared by the HTTP and HTTPS servers.

include /etc/nginx/mouzoun/security-headers.conf;

if ($host = www.__DOMAIN__) {
    return 301 $scheme://__DOMAIN__$request_uri;
}

location = /v1/auth/login {
    limit_req zone=mouzoun_login burst=5 nodelay;
    include /etc/nginx/mouzoun/proxy.conf;
    proxy_pass http://$mouzoun_upstream;
}

# Website build assets (hashed file names): cache forever.
location /_nuxt/ {
    include /etc/nginx/mouzoun/proxy.conf;
    proxy_pass http://$mouzoun_upstream;
    expires 1y;
    include /etc/nginx/mouzoun/security-headers.conf;
    add_header Cache-Control "public, immutable" always;
}

location /admin {
    include /etc/nginx/mouzoun/proxy.conf;
    proxy_pass http://$mouzoun_upstream;
    include /etc/nginx/mouzoun/security-headers.conf;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location / {
    limit_req zone=mouzoun_api burst=60 nodelay;
    include /etc/nginx/mouzoun/proxy.conf;
    proxy_pass http://$mouzoun_upstream;
}
