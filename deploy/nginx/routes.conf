# Mouzoun routes — installed to /etc/nginx/mouzoun/routes.conf by back/deploy/deploy.sh.
# Included by both the HTTP and the HTTPS server of conf.d/default.conf.

if ($host = www.__DOMAIN__) {
    return 301 $scheme://__DOMAIN__$request_uri;
}

access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log warn;

client_max_body_size 5M; # uploads go straight to Google Cloud Storage, never through nginx
large_client_header_buffers 4 16k;

root /var/www/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
limit_req_status 429;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection '';
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 2s; # loopback: a healthy upstream connects instantly
proxy_read_timeout 30s;

# ---- API ----------------------------------------------------------------------------------
location = /api {
    return 301 /api/;
}

location = /api/v1/auth/login {
    limit_req zone=mouzoun_login_rl burst=5 nodelay;
    proxy_pass http://mouzoun_back/v1/auth/login;
}

location /api/ {
    limit_req zone=mouzoun_api_rl burst=60 nodelay;
    proxy_set_header X-Forwarded-Prefix /api;
    proxy_pass http://mouzoun_back/; # trailing slash: strips the /api prefix
}

# ---- Website + admin ------------------------------------------------------------------------
# (a block declaring add_header drops the inherited ones, so they are repeated)
location /_nuxt/ {
    proxy_next_upstream error timeout;
    proxy_pass http://mouzoun_front;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location /admin {
    proxy_next_upstream error timeout;
    proxy_pass http://mouzoun_front;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location / {
    proxy_next_upstream error timeout;
    proxy_pass http://mouzoun_front;
}
