# Mouzoun — installed to /etc/nginx/conf.d/default.conf by back/deploy/deploy.sh.
# nginx is owned by the back repo (this file, the API upstream file and every reload).
# __DOMAIN__ is replaced at deploy time with the domain of the APP_URL secret.
#
#   https://__DOMAIN__/api/...  → API (the /api prefix is stripped: /api/v1/... → /v1/...)
#   https://__DOMAIN__/...      → website + admin (Nuxt)

# API: blue/green upstream file, rewritten by the back deploy on every release.
include /etc/nginx/mouzoun/back-upstream.conf;

# Website: both blue/green ports are listed. The front deploy never touches nginx: it starts the
# new color, keeps both running longer than fail_timeout (DRAIN_SECONDS=15 > 10s), then stops the
# old one; nginx skips the stopped port and retries any request that hits it on the live one.
upstream mouzoun_front {
    server 127.0.0.1:13001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:13002 max_fails=1 fail_timeout=10s;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=mouzoun_api_rl:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=mouzoun_login_rl:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;
    # include ssl certificate only in prod (*)
    include /etc/ssl/mouzoun/ssl_config.conf*;
    server_name __DOMAIN__ www.__DOMAIN__;

    #redirect to https only when in production (file exists only in prod)
    include /etc/ssl/mouzoun/ssl_redirect.conf*;

    if ($host = www.__DOMAIN__) {
        return 301 $scheme://__DOMAIN__$request_uri;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 5M; # uploads go straight to Google Cloud Storage, never through nginx
    large_client_header_buffers 4 16k;

    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s; # loopback: a healthy upstream connects instantly
    proxy_read_timeout 30s;

    # ---- API ------------------------------------------------------------------------------
    location = /api {
        return 301 /api/;
    }

    location = /api/v1/auth/login {
        limit_req zone=mouzoun_login_rl burst=5 nodelay;
        proxy_pass http://mouzoun_back/v1/auth/login;
    }

    location /api/ {
        limit_req zone=mouzoun_api_rl burst=60 nodelay;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_pass http://mouzoun_back/; # trailing slash: strips the /api prefix
    }

    # ---- Website + admin --------------------------------------------------------------------
    # (a block declaring add_header drops the inherited ones, so they are repeated)
    location /_nuxt/ {
        proxy_next_upstream error timeout;
        proxy_pass http://mouzoun_front;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /admin {
        proxy_next_upstream error timeout;
        proxy_pass http://mouzoun_front;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_next_upstream error timeout;
        proxy_pass http://mouzoun_front;
    }
}

# Internal API endpoint for the website's server-side rendering (loopback only, never public).
# Always points to the live back release, whatever its color.
server {
    listen 127.0.0.1:18080;
    access_log off;

    location / {
        proxy_pass http://mouzoun_back;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host __DOMAIN__;
    }
}
