# Mouzoun — installed to /etc/nginx/conf.d/default.conf by deploy/deploy.sh (previous file kept as .bak).
# __DOMAIN__ is replaced by the CI with the domain of the APP_URL secret.
#
# Same structure as before: one HTTP default server (redirects to HTTPS once
# /etc/ssl/mouzoun/ssl_redirect.conf exists) and one TLS server (/etc/ssl/mouzoun/ssl_config.conf).
# Each include appears once. Requests are routed by host: api.__DOMAIN__ → API, the rest → website.

access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log warn;

client_max_body_size 5M;
large_client_header_buffers 4 16k;

root /var/www/html;
index index.html;

# Blue/green upstreams, rewritten by the deploy scripts on every release.
include /etc/nginx/mouzoun/back-upstream.conf;
include /etc/nginx/mouzoun/front-upstream.conf;

map $host $mouzoun_upstream {
    api.__DOMAIN__ mouzoun_back;
    default        mouzoun_front;
}

# Rate limits apply to the API host only (empty key = not counted).
map $host $mouzoun_api_client {
    api.__DOMAIN__ $binary_remote_addr;
    default        '';
}
limit_req_zone $mouzoun_api_client zone=mouzoun_api:10m rate=30r/s;
limit_req_zone $mouzoun_api_client zone=mouzoun_login:10m rate=5r/m;
limit_req_status 429;

map $http_upgrade $mouzoun_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;

    #redirect to https only when in production (file exists only in prod)
    include /etc/ssl/mouzoun/ssl_redirect.conf*;

    include /etc/nginx/mouzoun/routes.conf;
}

server {
    # include ssl certificate only in prod (*)
    include /etc/ssl/mouzoun/ssl_config.conf*;
    server_name __DOMAIN__ *.__DOMAIN__;

    include /etc/nginx/mouzoun/routes.conf;
}

# Internal API endpoint for the website's server-side rendering (loopback only, never public).
server {
    listen 127.0.0.1:18080;
    access_log off;

    location / {
        proxy_pass http://mouzoun_back;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host api.__DOMAIN__;
    }
}
