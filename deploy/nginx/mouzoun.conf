# Mouzoun — nginx site, installed to /etc/nginx/conf.d/mouzoun.conf by back/deploy/deploy.sh.
# __DOMAIN__ is replaced by the CI with the `DOMAIN` variable of the GitHub environment.
#
# The two upstreams are rewritten by the deploy scripts on every release (blue/green switch).
include /etc/nginx/mouzoun/back-upstream.conf;
include /etc/nginx/mouzoun/front-upstream.conf;

limit_req_zone $binary_remote_addr zone=mouzoun_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=mouzoun_login:10m rate=5r/m;
limit_req_status 429;

map $http_upgrade $mouzoun_connection {
    default upgrade;
    ''      '';
}

# Internal API endpoint for the front's server-side rendering (loopback only, never public).
server {
    listen 127.0.0.1:18080;
    access_log off;

    location / {
        proxy_pass http://mouzoun_back;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host api.__DOMAIN__;
    }
}

# Public API
server {
    listen 80;
    listen [::]:80;
    server_name api.__DOMAIN__;

    # TLS: optional includes, present only once certificates are installed (see README).
    include /etc/ssl/mouzoun/ssl_config.conf*;
    include /etc/ssl/mouzoun/ssl_redirect.conf*;

    client_max_body_size 2m; # files are uploaded straight to Google Cloud Storage
    include /etc/nginx/mouzoun/security-headers.conf;

    location = /v1/auth/login {
        limit_req zone=mouzoun_login burst=5 nodelay;
        include /etc/nginx/mouzoun/proxy.conf;
        proxy_pass http://mouzoun_back;
    }

    location / {
        limit_req zone=mouzoun_api burst=60 nodelay;
        include /etc/nginx/mouzoun/proxy.conf;
        proxy_pass http://mouzoun_back;
    }
}

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    include /etc/ssl/mouzoun/ssl_config.conf*;
    return 301 https://__DOMAIN__$request_uri;
}

# Website + admin (Nuxt)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    include /etc/ssl/mouzoun/ssl_config.conf*;
    include /etc/ssl/mouzoun/ssl_redirect.conf*;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /etc/nginx/mouzoun/security-headers.conf;

    # Hashed build assets: cache forever.
    location /_nuxt/ {
        include /etc/nginx/mouzoun/proxy.conf;
        proxy_pass http://mouzoun_front;
        expires 1y;
        include /etc/nginx/mouzoun/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
    }

    location /admin {
        include /etc/nginx/mouzoun/proxy.conf;
        proxy_pass http://mouzoun_front;
        include /etc/nginx/mouzoun/security-headers.conf;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        include /etc/nginx/mouzoun/proxy.conf;
        proxy_pass http://mouzoun_front;
    }
}
