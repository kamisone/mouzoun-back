name: CI/CD - DEV - BACK

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: redeploy an existing image tag (e.g. v42) without rebuilding. Empty = build this commit."
        required: false
        default: ""

# Never run two deployments to the same server at once; never cancel one half-way.
concurrency:
  group: deploy-dev-back
  cancel-in-progress: false

jobs:
  # ── Quality gate: format, lint, unit + integration tests on real Postgres/Redis ────────────
  test:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mouzoun
          POSTGRES_PASSWORD: mouzoun
          POSTGRES_DB: mouzoun
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mouzoun" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://mouzoun:mouzoun@localhost:5432/mouzoun
      REDIS_URL: redis://localhost:6379
      # Queries are checked against the committed .sqlx metadata: a query changed without
      # `cargo sqlx prepare -- --all-targets --all-features` fails the build here.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Applied migrations are immutable: SQLx refuses to start when one changes (checksum), so an
      # edit breaks every later deploy (what happened with 0006/0008/0012). Compared with the
      # commit of the last SUCCESSFUL deploy, i.e. what production really applied.
      - name: deployed migrations are unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployed="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-dev.yml/runs?branch=dev&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // empty')"
          if [ -z "$deployed" ] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            echo "no successful deploy to compare with"; exit 0
          fi
          changed="$(git diff --name-only --diff-filter=MDR "$deployed" HEAD -- migrations/)"
          if [ -n "$changed" ]; then
            echo "::error::Migrations applied in production (deployed commit $deployed) were modified, renamed or deleted:"
            echo "$changed"
            echo "Restore them and put the change in a new migration."
            exit 1
          fi
          echo "migrations applied in production ($deployed) are unchanged"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # ── Build the image once, tag it with the run number (immutable) ──────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=${{ secrets.DOCKER_HUB_USERNAME }}/mouzoun_back:v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/mouzoun_back:dev
          # Rust builds are slow: reuse layers (dependencies) across runs.
          cache-from: type=gha,scope=back
          cache-to: type=gha,scope=back,mode=max

  # ── Ship to the VPS: blue/green switch with health gate (see deploy/deploy.sh) ────────────
  deploy:
    needs: [test, build]
    # Runs after a successful build, or alone for a rollback (test/build skipped).
    if: always() && (needs.build.result == 'success' || (inputs.image_tag != '' && needs.build.result == 'skipped'))
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: prepare release files
        id: release
        env:
          APP_URL: ${{ secrets.APP_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GCS_PROJECT_ID: ${{ secrets.GCS_PROJECT_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          # optional
          GCS_PRIVATE_BUCKET_NAME: ${{ secrets.GCS_PRIVATE_BUCKET_NAME }}
          GCS_PUBLIC_BASE_URL: ${{ secrets.GCS_PUBLIC_BASE_URL }}
          # Transactional emails (optional: without SMTP_HOST emails are only logged)
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Booking: guest ID numbers are encrypted with this key (openssl rand -base64 32).
          GUEST_DATA_KEY: ${{ secrets.GUEST_DATA_KEY }}
          # Online payments (optional until you add them: the three go together).
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Optional: bot protection, Google / Apple sign-in.
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          missing=""
          for name in APP_URL POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB REDIS_PASSWORD JWT_SECRET \
                      ADMIN_EMAIL ADMIN_PASSWORD GCS_BUCKET_NAME GCS_PROJECT_ID GCS_CLIENT_EMAIL \
                      GCS_PRIVATE_KEY_ID GCS_PRIVATE_KEY GUEST_DATA_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Missing secrets on the 'dev' environment:$missing"; exit 1; }

          # Stripe: all three or none (the API refuses a partial set at startup too).
          stripe_set=0
          for name in STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET; do [ -n "${!name}" ] && stripe_set=$((stripe_set + 1)); done
          case "$stripe_set" in
            0) echo "::warning::Stripe is not configured: online payment is off (pay at the camp only)" ;;
            3) ;;
            *) echo "::error::Set all three STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET, or none"; exit 1 ;;
          esac

          # Turnstile: both keys or none (the API refuses one alone at startup too).
          if { [ -n "$TURNSTILE_SECRET_KEY" ] && [ -z "$TURNSTILE_SITE_KEY" ]; } || { [ -z "$TURNSTILE_SECRET_KEY" ] && [ -n "$TURNSTILE_SITE_KEY" ]; }; then
            echo "::error::Set both TURNSTILE_SECRET_KEY and TURNSTILE_SITE_KEY, or none"; exit 1
          fi

          # https://mouzoun.com → mouzoun.com (nginx server names, CORS)
          app_url="${APP_URL%/}"
          domain="${app_url#*://}"
          domain="${domain#www.}"
          echo "domain=$domain" >> "$GITHUB_OUTPUT"

          mkdir -p release/nginx
          cp deploy/deploy.sh release/
          for f in web.conf routes.conf; do
            sed "s/__DOMAIN__/$domain/g" "deploy/nginx/$f" > "release/nginx/$f"
          done

          # Emails: SMTP when configured, otherwise logged only (never silently: a warning is shown).
          if [ -n "$SMTP_HOST" ]; then
            [ -n "$EMAIL_FROM" ] || { echo "::error::SMTP_HOST is set but EMAIL_FROM is missing"; exit 1; }
            email_provider=smtp
          else
            echo "::warning::SMTP_HOST is not set: emails are only written to the API logs, not sent"
            email_provider=log
          fi

          # The key may be pasted as a real multi-line PEM or with \n escapes: store it on one line.
          gcs_key="${GCS_PRIVATE_KEY//$'\r'/}"
          gcs_key="${gcs_key//$'\n'/\\n}"

          # Built in memory, never written to disk; base64 keeps it on one line for the SSH step.
          env_content="$(
            # Infrastructure containers (DATABASE_URL / REDIS_URL are derived by deploy.sh)
            printf '%s\n' "POSTGRES_USER=$POSTGRES_USER" "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
              "POSTGRES_DB=$POSTGRES_DB" "REDIS_PASSWORD=$REDIS_PASSWORD"
            # API
            printf '%s\n' "APP_ENV=production" "PAYMENTS_FAKE=false" "COOKIE_SECURE=true" \
              "API_PUBLIC_URL=$app_url/api" "WEBAUTHN_RP_ID=$domain" "WEBAUTHN_ORIGIN=$app_url" \
              "GUEST_DATA_KEY=$GUEST_DATA_KEY" "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY" \
              "TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY" \
              "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" "STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" \
              "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" \
              "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
              "APPLE_CLIENT_ID=$APPLE_CLIENT_ID" "APPLE_TEAM_ID=$APPLE_TEAM_ID" "APPLE_KEY_ID=$APPLE_KEY_ID" \
              "APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY//$'\n'/\\n}"
            printf '%s\n' "LOG_JSON=true" "RUST_LOG=mouzoun_api=info,tower_http=info" \
              "DATABASE_MAX_CONNECTIONS=30" "JWT_SECRET=$JWT_SECRET" "JWT_TTL_MINUTES=720" \
              "CORS_ORIGINS=https://$domain,https://www.$domain" \
              "ADMIN_EMAIL=$ADMIN_EMAIL" "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            # Google Cloud Storage
            printf '%s\n' "GCS_BUCKET_NAME=$GCS_BUCKET_NAME" "GCS_PRIVATE_BUCKET_NAME=$GCS_PRIVATE_BUCKET_NAME" \
              "GCS_PUBLIC_BASE_URL=$GCS_PUBLIC_BASE_URL" "GCS_PROJECT_ID=$GCS_PROJECT_ID" \
              "GCS_CLIENT_EMAIL=$GCS_CLIENT_EMAIL" "GCS_PRIVATE_KEY_ID=$GCS_PRIVATE_KEY_ID" \
              "GCS_PRIVATE_KEY=$gcs_key"
            # Transactional emails (links point to the website)
            printf '%s\n' "EMAIL_PROVIDER=$email_provider" "PUBLIC_SITE_URL=$app_url" \
              "EMAIL_FROM=${EMAIL_FROM:-no-reply@$domain}" "EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Mouzoun}" \
              "EMAIL_REPLY_TO=$EMAIL_REPLY_TO" "SMTP_HOST=$SMTP_HOST" "SMTP_PORT=$SMTP_PORT" \
              "SMTP_TLS=$SMTP_TLS" "SMTP_USER=$SMTP_USER" "SMTP_PASSWORD=$SMTP_PASSWORD"
          )"
          env_b64="$(printf '%s\n' "$env_content" | base64 -w0)"
          echo "::add-mask::$env_b64"
          echo "BACK_ENV_B64=$env_b64" >> "$GITHUB_ENV"

      - name: copy release files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_USER_PASSWORD }}
          source: release/*
          target: mouzoun/back
          strip_components: 1
          overwrite: true

      - name: deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Built here, not passed between jobs/steps: GitHub drops outputs containing a secret
          # (the Docker Hub username). Rollback tag if given, else this run's image (same run number).
          IMAGE_REF: ${{ secrets.DOCKER_HUB_USERNAME }}/mouzoun_back:${{ inputs.image_tag || format('v{0}', github.run_number) }}
          BACK_ENV_B64: ${{ env.BACK_ENV_B64 }}
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_HUB_PASSWORD }}
          SUDO_PASS: ${{ secrets.SERVER_USER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_USER_PASSWORD }}
          envs: IMAGE_REF,BACK_ENV_B64,DOCKER_USER,DOCKER_PASS,SUDO_PASS
          command_timeout: 15m
          script: |
            set -e
            test -n "$IMAGE_REF" || { echo "IMAGE_REF is empty"; exit 1; }
            # Everything runs as root through sudo (password from SERVER_USER_PASSWORD, never echoed).
            # sudo reads its password line, docker login reads the next one.
            { printf '%s\n' "$SUDO_PASS"; printf '%s\n' "$DOCKER_PASS"; } | sudo -S -p '' docker login -u "$DOCKER_USER" --password-stdin >/dev/null
            # sudo reads the first line (password), deploy.sh reads the rest (env file content).
            { printf '%s\n' "$SUDO_PASS"; printf '%s' "$BACK_ENV_B64" | base64 -d; } |
              sudo -S -p '' bash "$HOME/mouzoun/back/deploy.sh" "$IMAGE_REF" --env-stdin

      - name: public smoke test
        run: |
          for _ in $(seq 1 10); do
            curl -fsS -m 5 "https://${{ steps.release.outputs.domain }}/api/health/ready" && exit 0
            curl -fsS -m 5 "http://${{ steps.release.outputs.domain }}/api/health/ready" && exit 0
            sleep 3
          done
          echo "::warning::API not reachable from the internet yet (DNS/TLS?). The container itself passed its health gate."
